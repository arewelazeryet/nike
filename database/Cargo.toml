[package]
name = "ushio-database"
version = "0.1.0"
edition = "2024"

[dependencies]
bigdecimal = { version = "0.4.10", features = ["serde"] }
color-eyre = "0.6.5"
futures = "0.3.32"
rosu-mods = { version = "0.4.1", features = ["serde"] }
rosu-v2 = { version = "0.11.0", features = ["serialize"] }
serde.workspace = true
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "macros", "time", "bigdecimal", "postgres", "json"] }
time = "0.3.53"
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing = { workspace = true, features = ["async-await"] }
